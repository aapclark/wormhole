---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubo-data
data:
  ccq-rate-limits.json: |
    {
      "EVM": {
        "50000": "1 QPS",
        "5000": "1 QPM"
      },
      "Solana": {
        "125000": "1 QPS",
        "12500": "1 QPM"
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: kubo
  labels:
    app: kubo
spec:
  ports:
    - port: 5001
      name: api
      protocol: TCP
    - port: 8080
      name: gateway
      protocol: TCP
    - port: 4001
      name: swarm
      protocol: TCP
  clusterIP: None
  selector:
    app: kubo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kubo
spec:
  selector:
    matchLabels:
      app: kubo
  serviceName: kubo
  replicas: 1
  template:
    metadata:
      labels:
        app: kubo
    spec:
      volumes:
        - name: ipfs-data
          configMap:
            name: kubo-data
        - name: ipfs-repo
          emptyDir: {}
      containers:
        - name: kubo
          image: kubo-node
          env:
            - name: IPFS_PATH
              value: /tmp/ipfs
            - name: IPFS_TELEMETRY
              value: "off"
          volumeMounts:
            - name: ipfs-data
              mountPath: /data-to-add
              readOnly: true
            - name: ipfs-repo
              mountPath: /tmp/ipfs
          command:
            - sh
            - -c
            - |
              # Initialize IPFS in ephemeral mode (no repo persistence)
              ipfs init --empty-repo

              # Configure for local development
              ipfs config Addresses.API /ip4/0.0.0.0/tcp/5001
              ipfs config Addresses.Gateway /ip4/0.0.0.0/tcp/8080
              ipfs config --json API.HTTPHeaders.Access-Control-Allow-Origin '["*"]'
              ipfs config --json API.HTTPHeaders.Access-Control-Allow-Methods '["GET", "POST", "PUT"]'
              ipfs config --bool Gateway.NoFetch false
              ipfs config --bool Gateway.UseSubdomains false

              # Start daemon in background to add files
              ipfs daemon --enable-gc &
              DAEMON_PID=$!

              # Wait for daemon to be ready
              until ipfs id > /dev/null 2>&1; do
                echo "Waiting for IPFS daemon to start..."
                sleep 1
              done

              # Add JSON data to IPFS and capture CID
              echo "Adding ccq-rate-limits.json to IPFS..."
              # Add with raw-leaves to get content-only CID
              CID=$(cat /data-to-add/ccq-rate-limits.json | ipfs add -Q --raw-leaves --cid-version=1)
              echo "=========================================="
              echo "CCQ Rate Limits CID: $CID"
              echo "=========================================="
              echo "Access via: http://localhost:8080/ipfs/$CID"
              echo "=========================================="

              # Wait for daemon process
              wait $DAEMON_PID
          ports:
            - containerPort: 5001
              name: api
              protocol: TCP
            - containerPort: 8080
              name: gateway
              protocol: TCP
            - containerPort: 4001
              name: swarm
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - ipfs
                - id
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - ipfs
                - id
            initialDelaySeconds: 10
            periodSeconds: 10
